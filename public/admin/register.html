<!-- 관리자 계정 생성 -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>관리자 계정 생성 - PREMIUM BURGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Work Sans", "Noto Sans KR", sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .register-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 80px 100px 70px;
            width: 100%;
            max-width: 900px;
            min-height: 720px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .register-header {
            text-align: center;
            margin-bottom: 50px;
            width: 100%;
        }

        .register-header h1 {
            font-size: 70px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .register-header p {
            font-size: 20px;
            color: #999999;
            font-weight: 400;
        }

        .form-area {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        /* Two-column row */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            font-family: "Noto Sans KR", sans-serif;
        }

        .form-group input {
            width: 100%;
            height: 60px;
            padding: 0 20px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            font-family: "Noto Sans KR", sans-serif;
            color: #333;
            background: #fff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input::placeholder {
            color: #bbb;
            font-weight: 400;
        }

        .form-group input:focus {
            border-color: #DC2626;
        }

        /* Role Selection */
        .role-section {
            margin-bottom: 32px;
        }

        .role-section label.section-label {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            font-family: "Noto Sans KR", sans-serif;
        }

        .role-options {
            display: flex;
            gap: 20px;
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-option .role-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 20px;
            height: 70px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .role-option input[type="radio"]:checked+.role-card {
            border-color: #DC2626;
            background-color: #fef2f2;
        }

        .role-card .role-name {
            font-size: 20px;
            font-weight: 700;
            color: #999;
            font-family: "Work Sans", sans-serif;
            transition: color 0.2s ease;
        }

        .role-option input[type="radio"]:checked+.role-card .role-name {
            color: #DC2626;
        }

        .role-card .role-desc {
            font-size: 13px;
            color: #bbb;
            font-family: "Noto Sans KR", sans-serif;
        }

        .role-option input[type="radio"]:checked+.role-card .role-desc {
            color: #DC2626;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            height: 62px;
            background-color: #DC2626;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 700;
            font-family: "Noto Sans KR", sans-serif;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #b91c1c;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Messages */
        .message {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .message.show {
            display: flex;
        }

        .message.error {
            background-color: #fef2f2;
            color: #DC2626;
            border: 1px solid #fecaca;
        }

        .message.success {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .message .material-symbols-outlined {
            font-size: 20px;
        }
    </style>
    <link rel="stylesheet" href="css/darkmode.css">
    <script>if (localStorage.getItem('admin-dark-mode') === 'true') document.documentElement.classList.add('dark');</script>
</head>

<body>
    <div class="register-card">
        <div class="register-header">
            <h1>Sign Up</h1>
            <p>관리자 계정을 생성해 주세요.</p>
        </div>

        <div class="form-area">
            <form id="registerForm">
                <!-- 이름 & 아이디 -->
                <div class="form-row">
                    <div class="form-group">
                        <label>이름</label>
                        <input id="name" type="text" placeholder="이름을 입력해주세요" required />
                    </div>
                    <div class="form-group">
                        <label>아이디</label>
                        <input id="adminId" type="text" placeholder="아이디를 입력해주세요" required />
                    </div>
                </div>

                <!-- 이메일 -->
                <div class="form-group">
                    <label>이메일</label>
                    <input id="email" type="email" placeholder="이메일 주소를 입력해주세요" required />
                </div>

                <!-- 비밀번호 & 비밀번호 확인 -->
                <div class="form-row">
                    <div class="form-group">
                        <label>비밀번호</label>
                        <input id="password" type="password" placeholder="비밀번호를 입력해주세요" required />
                    </div>
                    <div class="form-group">
                        <label>비밀번호 확인</label>
                        <input id="passwordConfirm" type="password" required />
                    </div>
                </div>

                <!-- 권한 -->
                <div class="role-section">
                    <label class="section-label">권한</label>
                    <div class="role-options">
                        <label class="role-option">
                            <input checked name="role" type="radio" value="manager" />
                            <div class="role-card">
                                <span class="role-name">MANAGER</span>
                                <span class="role-desc">전체 권한</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input name="role" type="radio" value="staff" />
                            <div class="role-card">
                                <span class="role-name">STAFF</span>
                                <span class="role-desc">제한된 권한</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Messages -->
                <div id="errorMessage" class="message error">
                    <span class="material-symbols-outlined">error</span>
                    <p></p>
                </div>
                <div id="successMessage" class="message success">
                    <span class="material-symbols-outlined">check_circle</span>
                    <p>계정이 생성되었습니다! 로그인 페이지로 이동합니다...</p>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn">가입하기</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const username = document.getElementById('adminId').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Reset messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // Validate passwords match
            if (password !== passwordConfirm) {
                errorMessage.querySelector('p').textContent = '비밀번호가 일치하지 않습니다.';
                errorMessage.classList.add('show');
                return;
            }

            // Validate password length
            if (password.length < 4) { // Backend might have loose or strict rules, but 4 is safe minimum for testing
                errorMessage.querySelector('p').textContent = '비밀번호는 4자 이상이어야 합니다.';
                errorMessage.classList.add('show');
                return;
            }

            // Map frontend role to backend AdminRole enum
            const roles = role === 'manager' ? ['ROLE_MANAGER'] : ['ROLE_STAFF'];

            try {
                const response = await fetch('/api/v1/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        roles,
                        name,
                        email,
                        status: 'ACTIVE'
                    })
                });

                if (response.ok) {
                    successMessage.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    const resData = await response.json();
                    errorMessage.querySelector('p').textContent = resData.message || '계정 생성에 실패했습니다. 이미 존재하는 아이디일 수 있습니다.';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.querySelector('p').textContent = '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>

</html>
