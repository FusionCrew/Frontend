<!-- 관리자 계정 생성 -->
<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>관리자 계정 생성 - PREMIUM BURGER</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#DC2626", "secondary": "#000000", "bg-main": "#FFFFFF", "bg-sub": "#F8FAFC", "border-light": "#E2E8F0", "text-dark": "#0F172A", "text-muted": "#64748B" },
                    fontFamily: { "sans": ["Pretendard", "Inter", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: "Work Sans", "Noto Sans KR", sans-serif;
        }

        .form-input:focus {
            border-color: #d41121 !important;
            outline: none;
        }
    </style>
</head>

<body class="bg-bg-sub min-h-screen font-sans text-text-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <!-- Header / TopNavBar -->
        <header
            class="flex items-center justify-between whitespace-nowrap border-b border-border-light px-6 md:px-10 py-3 bg-white">
            <div class="flex items-center gap-4 text-text-dark">
                <div class="size-6 text-primary">
                    <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M13.8261 17.4264C16.7203 18.1174 20.2244 18.5217 24 18.5217C27.7756 18.5217 31.2797 18.1174 34.1739 17.4264C36.9144 16.7722 39.9967 15.2331 41.3563 14.1648L24.8486 40.6391C24.4571 41.267 23.5429 41.267 23.1514 40.6391L6.64374 14.1648C8.00331 15.2331 11.0856 16.7722 13.8261 17.4264Z"
                            fill="currentColor"></path>
                        <path clip-rule="evenodd"
                            d="M39.998 12.236C39.9944 12.2537 39.9875 12.2845 39.9748 12.3294C39.9436 12.4399 39.8949 12.5741 39.8346 12.7175C39.8168 12.7597 39.7989 12.8007 39.7813 12.8398C38.5103 13.7113 35.9788 14.9393 33.7095 15.4811C30.9875 16.131 27.6413 16.5217 24 16.5217C20.3587 16.5217 17.0125 16.131 14.2905 15.4811C12.0012 14.9346 9.44505 13.6897 8.18538 12.8168C8.17384 12.7925 8.16216 12.767 8.15052 12.7408C8.09919 12.6249 8.05721 12.5114 8.02977 12.411C8.00356 12.3152 8.00039 12.2667 8.00004 12.2612C8.00004 12.261 8 12.2607 8.00004 12.2612C8.00004 12.2359 8.0104 11.9233 8.68485 11.3686C9.34546 10.8254 10.4222 10.2469 11.9291 9.72276C14.9242 8.68098 19.1919 8 24 8C28.8081 8 33.0758 8.68098 36.0709 9.72276C37.5778 10.2469 38.6545 10.8254 39.3151 11.3686C39.9006 11.8501 39.9857 12.1489 39.998 12.236ZM4.95178 15.2312L21.4543 41.6973C22.6288 43.5809 25.3712 43.5809 26.5457 41.6973L43.0534 15.223C43.0709 15.1948 43.0878 15.1662 43.104 15.1371L41.3563 14.1648C43.104 15.1371 43.1038 15.1374 43.104 15.1371L43.1051 15.135L43.1065 15.1325L43.1101 15.1261L43.1199 15.1082C43.1276 15.094 43.1377 15.0754 43.1497 15.0527C43.1738 15.0075 43.2062 14.9455 43.244 14.8701C43.319 14.7208 43.4196 14.511 43.5217 14.2683C43.6901 13.8679 44 13.0689 44 12.2609C44 10.5573 43.003 9.22254 41.8558 8.2791C40.6947 7.32427 39.1354 6.55361 37.385 5.94477C33.8654 4.72057 29.133 4 24 4C18.867 4 14.1346 4.72057 10.615 5.94478C8.86463 6.55361 7.30529 7.32428 6.14419 8.27911C4.99695 9.22255 3.99999 10.5573 3.99999 12.2609C3.99999 13.1275 4.29264 13.9078 4.49321 14.3607C4.60375 14.6102 4.71348 14.8196 4.79687 14.9689C4.83898 15.0444 4.87547 15.1065 4.9035 15.1529C4.91754 15.1762 4.92954 15.1957 4.93916 15.2111L4.94662 15.223L4.95178 15.2312ZM35.9868 18.996L24 38.22L12.0131 18.996C12.4661 19.1391 12.9179 19.2658 13.3617 19.3718C16.4281 20.1039 20.0901 20.5217 24 20.5217C27.9099 20.5217 31.5719 20.1039 34.6383 19.3718C35.082 19.2658 35.5339 19.1391 35.9868 18.996Z"
                            fill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">PREMIUM BURGER</h2>
            </div>
            <a href="login.html"
                class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-secondary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:scale-[1.02] transition-all">
                <span class="truncate">로그인</span>
            </a>
        </header>

        <main class="flex flex-1 justify-center py-10 px-4">
            <div class="layout-content-container flex flex-col max-w-[560px] flex-1">
                <!-- Page Heading -->
                <div class="flex flex-wrap justify-between gap-3 p-4 mb-4">
                    <div class="flex min-w-72 flex-col gap-2 text-center md:text-left w-full">
                        <p
                            class="text-text-dark text-4xl font-black leading-tight tracking-[-0.033em] italic uppercase">
                            관리자 계정 생성</p>
                        <p class="text-text-muted text-base font-normal leading-normal">새로운 관리자 정보를
                            입력하여 시스템 권한을 부여하세요.</p>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="bg-white border border-border-light rounded-2xl shadow-xl overflow-hidden p-6 md:p-10">
                    <form id="registerForm" class="flex flex-col gap-6">
                        <!-- Name Field -->
                        <div class="flex flex-col gap-2">
                            <label class="text-[#181111] dark:text-white text-sm font-bold leading-normal">이름</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">badge</span>
                                <input id="name"
                                    class="form-input flex w-full rounded-lg text-[#181111] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e6dbdc] dark:border-white/10 bg-white dark:bg-background-dark focus:border-primary h-14 placeholder:text-[#896163] pl-12 pr-4 text-base font-normal leading-normal"
                                    placeholder="성함을 입력하세요" type="text" required />
                            </div>
                        </div>

                        <!-- ID Field -->
                        <div class="flex flex-col gap-2">
                            <label class="text-[#181111] dark:text-white text-sm font-bold leading-normal">관리자
                                ID</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400">person</span>
                                <input id="adminId"
                                    class="form-input flex w-full rounded-xl text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light bg-zinc-50 focus:border-primary h-14 placeholder:text-zinc-400 pl-12 pr-4 text-base font-normal leading-normal transition-all"
                                    placeholder="접속용 아이디를 입력하세요" type="text" required />
                            </div>
                        </div>

                        <!-- Email Field -->
                        <div class="flex flex-col gap-2">
                            <label class="text-[#181111] dark:text-white text-sm font-bold leading-normal">이메일</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
                                <input id="email"
                                    class="form-input flex w-full rounded-lg text-[#181111] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e6dbdc] dark:border-white/10 bg-white dark:bg-background-dark focus:border-primary h-14 placeholder:text-[#896163] pl-12 pr-4 text-base font-normal leading-normal"
                                    placeholder="example@burger.com" type="email" required />
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="flex flex-col gap-2">
                            <label class="text-[#181111] dark:text-white text-sm font-bold leading-normal">비밀번호</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
                                <input id="password"
                                    class="form-input flex w-full rounded-lg text-[#181111] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e6dbdc] dark:border-white/10 bg-white dark:bg-background-dark focus:border-primary h-14 placeholder:text-[#896163] pl-12 pr-4 text-base font-normal leading-normal"
                                    placeholder="8자 이상, 영문/숫자 조합" type="password" minlength="8" required />
                            </div>
                        </div>

                        <!-- Password Confirm Field -->
                        <div class="flex flex-col gap-2">
                            <label class="text-[#181111] dark:text-white text-sm font-bold leading-normal">비밀번호
                                확인</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">lock_reset</span>
                                <input id="passwordConfirm"
                                    class="form-input flex w-full rounded-lg text-[#181111] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e6dbdc] dark:border-white/10 bg-white dark:bg-background-dark focus:border-primary h-14 placeholder:text-[#896163] pl-12 pr-4 text-base font-normal leading-normal"
                                    placeholder="다시 한번 입력하세요" type="password" required />
                            </div>
                        </div>

                        <!-- Role Selection -->
                        <div class="flex flex-col gap-2">
                            <label class="text-text-dark text-sm font-bold leading-normal">권한 등급</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="cursor-pointer">
                                    <input checked class="peer hidden" name="role" type="radio" value="manager" />
                                    <div
                                        class="flex items-center justify-center h-12 rounded-xl border border-border-light peer-checked:border-secondary peer-checked:bg-secondary peer-checked:text-white transition-all shadow-sm">
                                        <span class="material-symbols-outlined mr-2 text-lg">manage_accounts</span>
                                        <span class="text-sm font-bold">매니저</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input class="peer hidden" name="role" type="radio" value="staff" />
                                    <div
                                        class="flex items-center justify-center h-12 rounded-xl border border-border-light peer-checked:border-secondary peer-checked:bg-secondary peer-checked:text-white transition-all shadow-sm">
                                        <span class="material-symbols-outlined mr-2 text-lg">person</span>
                                        <span class="text-sm font-bold">스태프</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div id="errorMessage"
                            class="hidden text-primary text-sm text-center py-2 px-4 bg-red-50 rounded-xl font-bold">
                            오류가 발생했습니다.
                        </div>

                        <div id="successMessage"
                            class="hidden text-green-600 text-sm text-center py-2 px-4 bg-green-50 rounded-xl font-bold">
                            계정이 성공적으로 생성되었습니다!
                        </div>

                        <!-- Submit Button -->
                        <div class="mt-4">
                            <button type="submit"
                                class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-4 bg-secondary text-white text-lg font-bold leading-normal tracking-[0.015em] hover:scale-[1.02] shadow-lg active:scale-[0.98] transition-all">
                                <span class="truncate">계정 생성</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Footer Navigation -->
                <div class="mt-6 flex justify-center">
                    <a href="login.html"
                        class="flex items-center gap-2 text-text-muted text-sm font-bold hover:text-primary transition-colors">
                        <span class="material-symbols-outlined text-lg">arrow_back</span>
                        <span>로그인 화면으로 돌아가기</span>
                    </a>
                </div>
            </div>
        </main>

        <!-- Aesthetic Footer -->
        <footer class="py-8 text-center text-[#896163]/60 dark:text-white/30 text-xs">
            © 2024 PREMIUM BURGER Admin Portal. All Rights Reserved.
        </footer>

        <!-- Background Pattern -->
        <div class="fixed inset-0 -z-10 opacity-5 pointer-events-none">
            <div class="absolute inset-0 bg-[radial-gradient(#d41121_1px,transparent_1px)] [background-size:20px_20px]">
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const adminId = document.getElementById('adminId').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Reset messages
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            // Validate passwords match
            if (password !== passwordConfirm) {
                errorMessage.textContent = '비밀번호가 일치하지 않습니다.';
                errorMessage.classList.remove('hidden');
                return;
            }

            // Validate password length
            if (password.length < 8) {
                errorMessage.textContent = '비밀번호는 8자 이상이어야 합니다.';
                errorMessage.classList.remove('hidden');
                return;
            }

            try {
                // TODO: 실제 API 연동 시 아래 주석 해제
                // const response = await fetch('/api/admin/register', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ name, adminId, email, password, role })
                // });
                // 
                // if (response.ok) {
                //     successMessage.classList.remove('hidden');
                //     setTimeout(() => {
                //         window.location.href = 'login.html';
                //     }, 2000);
                // } else {
                //     const data = await response.json();
                //     errorMessage.textContent = data.message || '계정 생성에 실패했습니다.';
                //     errorMessage.classList.remove('hidden');
                // }

                // 임시 계정 생성 처리 (테스트용)
                console.log('Account created:', { name, adminId, email, role });
                successMessage.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
