<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>매출 분석 - 버거샵 대시보드</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#B91C1C",
                        "bg-main": "#F3F4F6",
                        "bg-card": "#FFFFFF",
                        "text-dark": "#111827",
                        "text-muted": "#6B7280",
                        "text-light": "#9CA3AF",
                    },
                    fontFamily: { "sans": ["Pretendard", "Inter", "sans-serif"] },
                    boxShadow: { "premium": "0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 10px -2px rgba(0, 0, 0, 0.05)" }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        body { font-family: 'Pretendard', sans-serif; background-color: theme('colors.bg-main'); color: theme('colors.text-dark'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
        .sidebar-item-active {
            @apply text-text-dark relative font-bold;
        }
        .sidebar-item-active::after {
            content: '';
            @apply absolute right-0 top-0 bottom-0 w-[3px] bg-primary;
        }
        .sidebar-item-inactive {
            @apply text-text-light hover:text-text-dark transition-colors font-medium;
        }
        .card { @apply bg-white rounded-3xl shadow-premium border border-white p-8; }
        .stat-card-accent { @apply bg-primary text-white; }
        .rank-badge { @apply size-8 rounded-full flex items-center justify-center text-xs font-black shadow-lg; }
    </style>
</head>

<body class="antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-[280px] bg-white border-r border-gray-100 flex flex-col shrink-0">
            <div class="h-24"></div>

            <nav class="flex-1 px-4 space-y-1">
                <a href="index.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span class="material-symbols-outlined group-hover:fill transition-all text-2xl">dashboard</span>
                    <span class="text-base">대시 보드</span>
                </a>
                <a href="menu.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span class="material-symbols-outlined group-hover:fill transition-all text-2xl">lunch_dining</span>
                    <span class="text-base">메뉴 관리</span>
                </a>
                <a href="inventory.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span class="material-symbols-outlined group-hover:fill transition-all text-2xl">inventory_2</span>
                    <span class="text-base">재고 관리</span>
                </a>
                <a href="orders.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span class="material-symbols-outlined group-hover:fill transition-all text-2xl">receipt_long</span>
                    <span class="text-base">주문 내역</span>
                </a>
                <a href="payment.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span class="material-symbols-outlined group-hover:fill transition-all text-2xl">payments</span>
                    <span class="text-base">결제 관리</span>
                </a>
                <a href="analytics.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-active group">
                    <span class="material-symbols-outlined fill transition-all text-2xl">analytics</span>
                    <span class="text-base">매출 분석</span>
                </a>
                <a href="staff.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span
                        class="material-symbols-outlined group-hover:fill transition-all text-2xl">notifications_active</span>
                    <span class="text-base">직원 호출</span>
                </a>
                <div class="pt-10 pb-4 px-8">
                    <p class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em]">Settings</p>
                </div>
                <a href="account.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span
                        class="material-symbols-outlined group-hover:fill transition-all text-2xl">manage_accounts</span>
                    <span class="text-base">계정 설정</span>
                </a>
                <a href="ai-logs.html" class="flex items-center gap-4 px-8 py-5 sidebar-item-inactive group">
                    <span class="material-symbols-outlined group-hover:fill transition-all text-2xl">smart_toy</span>
                    <span class="text-base">AI 로그 관리</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-transparent flex items-center justify-between px-10">
                <div class="flex items-center gap-3">
                    <div class="size-10 bg-primary/10 rounded-xl flex items-center justify-center">
                        <span class="material-symbols-outlined fill text-primary">analytics</span>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight text-gray-800">매출 분석</h1>
                </div>

                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-6">
                        <button class="text-gray-400 hover:text-gray-600 transition-colors">
                            <span class="material-symbols-outlined text-[22px]">search</span>
                        </button>
                        <button class="text-gray-400 hover:text-gray-600 transition-colors relative">
                            <span class="material-symbols-outlined text-[22px]">notifications</span>
                            <span
                                class="absolute top-0 right-0 size-2 bg-primary rounded-full border-2 border-white"></span>
                        </button>
                        <button class="text-gray-400 hover:text-gray-600 transition-colors">
                            <span class="material-symbols-outlined text-[22px]">settings</span>
                        </button>
                    </div>
                    <div class="h-8 w-px bg-gray-200"></div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-medium text-gray-500">관리자 1님</span>
                        <div class="size-8 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden">
                            <span class="material-symbols-outlined text-gray-400">person</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto px-10 pb-10 space-y-8">
                <!-- Filter Section -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-gray-50 shadow-sm">
                        <input type="date" value="2024-03-01"
                            class="text-xs font-bold text-gray-600 border-none p-0 focus:ring-0 outline-none">
                        <span class="material-symbols-outlined text-sm text-gray-300">calendar_today</span>
                    </div>
                    <span class="text-gray-300">~</span>
                    <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-gray-50 shadow-sm">
                        <input type="date" value="2024-03-09"
                            class="text-xs font-bold text-gray-600 border-none p-0 focus:ring-0 outline-none">
                        <span class="material-symbols-outlined text-sm text-gray-300">calendar_today</span>
                    </div>
                    <button
                        class="px-6 py-2.5 bg-primary text-white text-[11px] font-bold rounded-xl shadow-lg shadow-primary/20 hover:scale-105 transition-all">조회</button>
                </div>

                <script src="js/api.js"></script>
                <script>
                    const API_BASE_URL = 'http://localhost:8080';

                    async function loadAnalytics() {
                        try {
                            const response = await fetch(`${API_BASE_URL}/api/v1/admin/analytics`);
                            if (!response.ok) throw new Error('API Failed');

                            const result = await response.json();
                            if (result.success && result.data) {
                                updateUI(result.data);
                            }
                        } catch (err) {
                            console.error('Failed to load analytics:', err);
                        }
                    }

                    function updateUI(data) {
                        const h2s = document.querySelectorAll('.card h2');
                        if (h2s.length >= 4) {
                            h2s[0].textContent = `₩${(data.todayRevenue || 0).toLocaleString()}`;
                            h2s[1].textContent = `₩${(data.avgOrderValue || 0).toLocaleString()}`;
                            h2s[2].textContent = `${(data.totalVisitors || 0)}명`;
                            h2s[3].textContent = `${(data.returnRate || 0)}%`;
                        }

                        // Update Top 5 List (simplification: only textual list for now)
                        const topMenus = data.topMenus || [];
                        const rankingContainer = document.querySelector('.space-y-4.border-t');
                        if (rankingContainer && topMenus.length >= 5) {
                            rankingContainer.innerHTML = topMenus.map((menu, i) => `
                    <div class="flex items-center justify-between px-4">
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-black text-gray-300 italic">${i + 1}</span>
                            <span class="text-xs font-bold text-gray-600">${menu.name}</span>
                        </div>
                        <span class="text-xs font-bold text-gray-400 italic">${menu.count}개</span>
                    </div>
                `).join('');
                        }

                        // AI Insights
                        const insightsContainer = document.querySelector('.space-y-10.relative');
                        const insights = data.aiInsights || [];
                        if (insightsContainer) {
                            insightsContainer.innerHTML = '<div class="absolute left-4 top-2 bottom-2 w-px bg-gray-100 border-dashed border-l"></div>' +
                                insights.map((insight, i) => {
                                    const parts = insight.split(':');
                                    const title = parts[0] ? parts[0].trim() : '';
                                    const desc = parts[1] ? parts[1].trim() : '';
                                    return `
                        <div class="relative flex gap-6">
                            <div class="size-8 rounded-full bg-text-dark text-white flex items-center justify-center text-[10px] font-black italic shrink-0 z-10">${String(i + 1).padStart(2, '0')}</div>
                            <div>
                                <h4 class="text-sm font-black text-gray-800 mb-1 italic">${title}</h4>
                                <p class="text-xs text-gray-400 leading-relaxed font-medium">${desc}</p>
                            </div>
                        </div>
                    `;
                                }).join('');
                        }
                    }

                    document.addEventListener('DOMContentLoaded', loadAnalytics);
                </script>
</body>

</html>
