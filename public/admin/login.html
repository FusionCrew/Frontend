<!-- 관리자 로그인 -->
<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>관리자 로그인 - PREMIUM BURGER</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#DC2626", "secondary": "#000000", "bg-main": "#FFFFFF", "bg-sub": "#F8FAFC", "border-light": "#E2E8F0", "text-dark": "#0F172A", "text-muted": "#64748B" },
                    fontFamily: { "sans": ["Pretendard", "Inter", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: "Work Sans", "Noto Sans KR", sans-serif;
        }

        .form-input:focus {
            border-color: #d41121 !important;
            outline: none;
        }
    </style>
</head>

<body class="bg-bg-sub min-h-screen flex flex-col font-sans text-text-dark">
    <!-- Top Navigation Bar -->
    <header class="flex items-center justify-between whitespace-nowrap border-b border-border-light px-6 py-3 bg-white">
        <div class="flex items-center gap-4 text-text-dark">
            <div class="size-6 text-primary">
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M13.8261 17.4264C16.7203 18.1174 20.2244 18.5217 24 18.5217C27.7756 18.5217 31.2797 18.1174 34.1739 17.4264C36.9144 16.7722 39.9967 15.2331 41.3563 14.1648L24.8486 40.6391C24.4571 41.267 23.5429 41.267 23.1514 40.6391L6.64374 14.1648C8.00331 15.2331 11.0856 16.7722 13.8261 17.4264Z"
                        fill="currentColor"></path>
                    <path clip-rule="evenodd"
                        d="M39.998 12.236C39.9944 12.2537 39.9875 12.2845 39.9748 12.3294C39.9436 12.4399 39.8949 12.5741 39.8346 12.7175C39.8168 12.7597 39.7989 12.8007 39.7813 12.8398C38.5103 13.7113 35.9788 14.9393 33.7095 15.4811C30.9875 16.131 27.6413 16.5217 24 16.5217C20.3587 16.5217 17.0125 16.131 14.2905 15.4811C12.0012 14.9346 9.44505 13.6897 8.18538 12.8168C8.17384 12.7925 8.16216 12.767 8.15052 12.7408C8.09919 12.6249 8.05721 12.5114 8.02977 12.411C8.00356 12.3152 8.00039 12.2667 8.00004 12.2612C8.00004 12.261 8 12.2607 8.00004 12.2612C8.00004 12.2359 8.0104 11.9233 8.68485 11.3686C9.34546 10.8254 10.4222 10.2469 11.9291 9.72276C14.9242 8.68098 19.1919 8 24 8C28.8081 8 33.0758 8.68098 36.0709 9.72276C37.5778 10.2469 38.6545 10.8254 39.3151 11.3686C39.9006 11.8501 39.9857 12.1489 39.998 12.236ZM4.95178 15.2312L21.4543 41.6973C22.6288 43.5809 25.3712 43.5809 26.5457 41.6973L43.0534 15.223C43.0709 15.1948 43.0878 15.1662 43.104 15.1371L41.3563 14.1648C43.104 15.1371 43.1038 15.1374 43.104 15.1371L43.1051 15.135L43.1065 15.1325L43.1101 15.1261L43.1199 15.1082C43.1276 15.094 43.1377 15.0754 43.1497 15.0527C43.1738 15.0075 43.2062 14.9455 43.244 14.8701C43.319 14.7208 43.4196 14.511 43.5217 14.2683C43.6901 13.8679 44 13.0689 44 12.2609C44 10.5573 43.003 9.22254 41.8558 8.2791C40.6947 7.32427 39.1354 6.55361 37.385 5.94477C33.8654 4.72057 29.133 4 24 4C18.867 4 14.1346 4.72057 10.615 5.94478C8.86463 6.55361 7.30529 7.32428 6.14419 8.27911C4.99695 9.22255 3.99999 10.5573 3.99999 12.2609C3.99999 13.1275 4.29264 13.9078 4.49321 14.3607C4.60375 14.6102 4.71348 14.8196 4.79687 14.9689C4.83898 15.0444 4.87547 15.1065 4.9035 15.1529C4.91754 15.1762 4.92954 15.1957 4.93916 15.2111L4.94662 15.223L4.95178 15.2312ZM35.9868 18.996L24 38.22L12.0131 18.996C12.4661 19.1391 12.9179 19.2658 13.3617 19.3718C16.4281 20.1039 20.0901 20.5217 24 20.5217C27.9099 20.5217 31.5719 20.1039 34.6383 19.3718C35.082 19.2658 35.5339 19.1391 35.9868 18.996Z"
                        fill="currentColor" fill-rule="evenodd"></path>
                </svg>
            </div>
            <h2 class="text-text-dark text-lg font-bold leading-tight tracking-[-0.015em]">PREMIUM
                BURGER</h2>
        </div>
        <div class="flex gap-4">
            <a href="register.html"
                class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold transition-colors hover:bg-primary/90">
                계정 생성
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-12">
        <div class="w-full max-w-[440px] bg-white rounded-2xl shadow-xl p-10 border border-border-light">
            <!-- Branding/Headline -->
            <div class="mb-8 text-center">
                <h1 class="text-primary tracking-tighter text-[32px] font-black italic leading-tight mb-2">PREMIUM
                    BURGER</h1>
                <h2 class="text-text-dark text-lg font-bold leading-tight tracking-[-0.015em]">관리자 로그인
                </h2>
            </div>

            <form id="loginForm" class="space-y-6">
                <!-- Admin ID Field -->
                <div class="flex flex-col gap-2">
                    <label class="text-text-dark text-sm font-bold leading-normal">아이디</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400">person</span>
                        <input id="adminId"
                            class="form-input flex w-full min-w-0 flex-1 rounded-xl text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light bg-zinc-50 h-14 placeholder:text-zinc-400 pl-12 pr-4 text-base font-normal leading-normal transition-all focus:border-primary"
                            placeholder="Admin ID" type="text" required />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="flex flex-col gap-2">
                    <label class="text-text-dark text-sm font-bold leading-normal">비밀번호</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400">lock</span>
                        <input id="password"
                            class="form-input flex w-full min-w-0 flex-1 rounded-xl text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light bg-zinc-50 h-14 placeholder:text-zinc-400 pl-12 pr-4 text-base font-normal leading-normal transition-all focus:border-primary"
                            placeholder="Password" type="password" required />
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer text-text-muted">
                        <input id="rememberMe" class="rounded text-primary focus:ring-primary border-border-light"
                            type="checkbox" />
                        로그인 상태 유지
                    </label>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                    class="hidden text-primary text-sm text-center py-2 px-4 bg-red-50 rounded-lg font-bold">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>

                <!-- Login Button -->
                <button type="submit"
                    class="flex w-full items-center justify-center rounded-xl h-14 bg-secondary text-white text-lg font-bold leading-normal transition-all hover:scale-[1.02] active:scale-[0.98] shadow-lg">
                    로그인
                </button>
            </form>

            <!-- Footer Links -->
            <div class="mt-8 flex items-center justify-center gap-6 border-t border-zinc-100 pt-6">
                <a class="text-text-muted text-sm font-medium hover:text-primary transition-colors"
                    href="forgot-password.html">
                    비밀번호 찾기
                </a>
                <span class="h-4 w-px bg-border-light"></span>
                <a class="text-text-muted text-sm font-medium hover:text-primary transition-colors"
                    href="register.html">
                    계정 생성
                </a>
            </div>
        </div>

        <!-- Extra decorative elements -->
        <div class="mt-8 text-center text-gray-400 text-xs">
            <p>© 2024 PREMIUM BURGER Admin Portal. All Rights Reserved.</p>
        </div>
    </main>

    <!-- Background Pattern -->
    <div class="fixed inset-0 -z-10 opacity-5 pointer-events-none">
        <div class="absolute inset-0 bg-[radial-gradient(#d41121_1px,transparent_1px)] [background-size:20px_20px]">
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const adminId = document.getElementById('adminId').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            try {
                // TODO: 실제 API 연동 시 아래 주석 해제
                // const response = await fetch('/api/admin/login', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ adminId, password })
                // });
                // 
                // if (response.ok) {
                //     window.location.href = 'index.html';
                // } else {
                //     errorMessage.classList.remove('hidden');
                // }

                // 임시 로그인 처리 (테스트용)
                if (adminId && password) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminId', adminId);
                    window.location.href = 'index.html';
                } else {
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
