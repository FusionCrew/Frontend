<!-- 관리자 로그인 -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>관리자 로그인 - PREMIUM BURGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Work Sans", "Noto Sans KR", sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 100px 100px 80px;
            width: 100%;
            max-width: 900px;
            min-height: 720px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-header {
            text-align: center;
            margin-bottom: 60px;
            width: 100%;
        }

        .login-header h1 {
            font-size: 70px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .login-header p {
            font-size: 20px;
            color: #999999;
            font-weight: 400;
        }

        .login-form-area {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 20px;
            color: #b0b0b0;
            font-size: 28px;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 70px;
            padding: 0 24px 0 60px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 22px;
            font-family: "Noto Sans KR", sans-serif;
            color: #333;
            background: #fff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #bbb;
            font-weight: 400;
        }

        .input-wrapper input:focus {
            border-color: #DC2626;
        }

        .login-btn {
            width: 100%;
            height: 62px;
            margin-top: 12px;
            background-color: #DC2626;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 700;
            font-family: "Noto Sans KR", sans-serif;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .login-btn:hover {
            background-color: #b91c1c;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .register-link {
            text-align: center;
            margin-top: 28px;
        }

        .register-link a {
            font-size: 20px;
            color: #888;
            text-decoration: underline;
            text-underline-offset: 6px;
            font-family: "Noto Sans KR", sans-serif;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #555;
        }

        /* Error message */
        .error-message {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            background-color: #fef2f2;
            color: #DC2626;
            border-radius: 10px;
            border: 1px solid #fecaca;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .error-message.show {
            display: flex;
        }

        .error-message .material-symbols-outlined {
            font-size: 20px;
        }
    </style>
    <link rel="stylesheet" href="css/darkmode.css">
    <script>if (localStorage.getItem('admin-dark-mode') === 'true') document.documentElement.classList.add('dark');</script>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Get Started Now</h1>
            <p>서비스 이용을 위해 로그인해 주세요.</p>
        </div>

        <div class="login-form-area">
            <form id="loginForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">person_outline</span>
                        <input id="adminId" type="text" placeholder="아이디를 입력하세요" required />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">lock_outline</span>
                        <input id="password" type="password" placeholder="비밀번호를 입력하세요" required />
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="error-message">
                    <span class="material-symbols-outlined">error</span>
                    <p>아이디 또는 비밀번호가 올바르지 않습니다.</p>
                </div>

                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="register-link">
                <a href="register.html">또는 회원가입</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('adminId').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/v1/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminId', username);
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    window.location.href = 'index.html';
                } else {
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>

</html>
